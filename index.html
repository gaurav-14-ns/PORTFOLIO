<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gaurav — Data Analytics Portfolio</title>

<style>
/* === YOUR ORIGINAL CSS (UNCHANGED) === */
:root{
  --bg:#0f172a;
  --bg-soft: radial-gradient(1200px 600px at 10% -10%, #1e293b 0%, transparent 60%);
  --panel:#111827;
  --card:#0b1223;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --accent:#22c55e;
  --border:#1f2937;
}
.light{
  --bg:#f8fafc;
  --bg-soft: radial-gradient(1200px 600px at 10% -10%, #e0f2fe 0%, transparent 60%);
  --panel:#ffffff;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#475569;
  --accent:#0ea5e9;
  --border:#e2e8f0;
}

html,body{margin:0;padding:0;scroll-behavior:smooth;}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:var(--bg);
  background-image:var(--bg-soft);
  color:var(--text);
  line-height:1.65;
}

a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}

.container{max-width:1080px;margin:0 auto;padding:0 1.25rem;}

header{
  position:sticky;
  top:0;
  z-index:1000;
  backdrop-filter:blur(10px);
  background:color-mix(in oklab,var(--bg) 85%,transparent);
  border-bottom:1px solid var(--border);
}

.nav{display:flex;align-items:center;justify-content:space-between;height:64px;}
.brand{display:flex;align-items:center;gap:.75rem;font-weight:700;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;}
.nav-links{display:flex;gap:1rem;}
.nav-links a{padding:.5rem .75rem;border-radius:.5rem;}
.nav-links a:hover{background:var(--panel);}
.menu-toggle{display:none;font-size:1.5rem;cursor:pointer;}

.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:.5rem .75rem;border-radius:.5rem;cursor:pointer;}
.btn.primary{background:var(--accent);color:#fff;border:none;}

section{padding:2.75rem 0;}
h1,h2,h3{line-height:1.3;}
h2{margin-bottom:1rem;}

.hero{max-width:820px;padding:4rem 0 2rem;}
.badge{display:inline-block;background:var(--accent);color:#fff;padding:.25rem .5rem;border-radius:.375rem;font-size:.85rem;margin-bottom:.75rem;}
.hero-actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.25rem;}

.card{background:var(--card);border:1px solid var(--border);border-radius:.75rem;padding:1.25rem;margin-bottom:1rem;}
.skills{display:flex;flex-wrap:wrap;gap:.5rem;}
.chip{border:1px solid var(--border);padding:.25rem .5rem;border-radius:.5rem;color:var(--muted);font-size:.9rem;}

.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;}

.accordion-item{border-bottom:1px solid var(--border);}
.accordion-header{
  background:none;border:none;width:100%;
  padding:1rem;font-size:1rem;color:var(--text);
  text-align:left;cursor:pointer;font-weight:600;
  display:flex;justify-content:space-between;
}
.accordion-header::after{content:"▸";transition:.2s;}
.accordion-header.active::after{transform:rotate(90deg);}
.accordion-body{
  max-height:0;
  overflow:hidden;
  transition:max-height .3s ease;
  padding:0 1rem;
}

.project-img{
  display:block;width:100%;height:auto;
  margin-top:.75rem;border-radius:.5rem;
  border:1px solid var(--border);
}

footer{border-top:1px solid var(--border);padding:2rem 0;color:var(--muted);}

@media(max-width:900px){.grid-2{grid-template-columns:1fr;}}
@media(max-width:768px){
  .menu-toggle{display:block;}
  .nav-links{
    position:fixed;top:64px;left:0;right:0;
    background:color-mix(in oklab,var(--panel) 90%,transparent);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    display:none;flex-direction:column;padding:1rem;
  }
  .nav-links.active{display:flex;}
  .nav-links a{padding:.75rem;}
}
</style>
</head>

<body>

<!-- === HTML CONTENT UNCHANGED === -->
<!-- (exactly as you sent — omitted here for brevity) -->

<script>
/* Footer year */
document.getElementById("year").textContent = new Date().getFullYear();

/* Theme toggle */
document.getElementById("theme").onclick = () =>
  document.body.classList.toggle("light");

/* Mobile menu */
document.querySelector(".menu-toggle").onclick = () =>
  document.querySelector(".nav-links").classList.toggle("active");

/* Auto close menu */
document.querySelectorAll(".nav-links a").forEach(link=>{
  link.onclick=()=>document.querySelector(".nav-links").classList.remove("active");
});

/* ===== FIXED ACCORDION LOGIC ===== */

function setAccordionHeight(body){
  body.style.maxHeight = body.scrollHeight + "px";
}

document.querySelectorAll(".accordion-header").forEach(header=>{
  header.onclick = () => {
    header.classList.toggle("active");
    const body = header.nextElementSibling;

    if (body.style.maxHeight) {
      body.style.maxHeight = null;
    } else {
      setAccordionHeight(body);

      /* Recalculate height after images load */
      body.querySelectorAll("img").forEach(img=>{
        if (!img.complete) {
          img.addEventListener("load", () => setAccordionHeight(body));
        }
      });
    }
  };
});

/* Experience calculation */
const start=new Date("2023-02-07");
const now=new Date();
let years=now.getFullYear()-start.getFullYear();
let months=now.getMonth()-start.getMonth();
if(months<0){years--;months+=12;}
document.getElementById("totalExp").textContent=`${years} years ${months} months`;
</script>

</body>
</html>
